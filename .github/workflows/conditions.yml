name: Update trail conditions

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: conditions
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch lift & trail reports
        run: python scripts/update_conditions.py
      - name: Commit if changed
        run: |
          # only commit when a resort report actually changed (ignore the timestamp)
          if git diff --quiet -I '"updated"' -- conditions.json; then
            echo "No report changes"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add conditions.json
          git commit -m "Update trail conditions"
          git push
